services:
  aws-cli:
    image: amazon/aws-cli:latest
    working_dir: /workspace
    entrypoint: ["tail", "-f", "/dev/null"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    env_file:
      - .env

  terraform:
    image: hashicorp/terraform:latest
    working_dir: /workspace
    entrypoint: ["tail", "-f", "/dev/null"]
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    env_file:
      - .env
